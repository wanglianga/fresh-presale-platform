services:
  mysql:
    image: mysql:8.0
    container_name: fresh-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: fresh_presale
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - fresh-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fresh-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fresh_presale
      DB_USERNAME: root
      DB_PASSWORD: password
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fresh-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fresh-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fresh-network

volumes:
  mysql-data:

networks:
  fresh-network:
    driver: bridge
